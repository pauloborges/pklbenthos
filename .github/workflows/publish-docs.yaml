# Build the Pkldoc site and publish it to GitHub Pages.
#
# The site covers every release that the tree holds, and not the newest release
# alone. Pkldoc keys a site by the name and the version of
# doc-package-info.pkl, which are the module prefix and the release, so every
# release of a distribution becomes another version of one package. The version
# selector of a page reads its list at run time from data/PACKAGE/_/index.json,
# and each run merges its own release into that list.
#
# Pkldoc runs once for each library, into one output directory. A run adds to
# what the directory already holds, and each run carries the
# doc-package-info.pkl of its own library, so no batch can lose it.
#
# Measured over 34 libraries: 98 seconds of Pkldoc, 611 MiB of site, and 41 MB
# after the artifact compresses. A published site must stay under 1 GB, so the
# last step fails when the site passes that. The window of releases slides
# instead of growing, and the components of a release grow about 3% over ten
# releases, so the size of the site holds steady.
name: Publish Pkl docs

on:
  push:
    branches: [main]
    paths:
      - "pkl/**"
  workflow_dispatch:
    inputs:
      releases:
        description: How many of the newest releases of each distribution to document, or all of them
        type: string
        default: all

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: "0.31.1"

      # The pkl command holds no `doc` subcommand, and nixpkgs carries no
      # package for Pkldoc, so take the binary that the release publishes.
      - name: Install Pkldoc
        env:
          PKL_VERSION: "0.31.1"
        run: |
          curl -fsSL -o /usr/local/bin/pkldoc \
            "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkldoc-linux-amd64"
          chmod +x /usr/local/bin/pkldoc
          pkldoc --version

      # The releases of a distribution go in from the oldest to the newest, so
      # that the newest one lands last and the current link of the package
      # points at it.
      - name: Generate
        working-directory: pkl
        env:
          RELEASES: ${{ inputs.releases || 'all' }}
        run: |
          out="$GITHUB_WORKSPACE/build/docs"
          count=0

          for dir in */; do
            name=${dir%/}
            versions=$(ls "$name" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)

            if [ "$RELEASES" != "all" ]; then
              versions=$(echo "$versions" | tail -n "$RELEASES")
            fi

            for version in $versions; do
              echo "  $name $version"

              { printf 'docsite-info.pkl\0'; find "$name/$version" -name '*.pkl' -print0; } \
                | xargs -0 pkldoc -o "$out" >/dev/null

              count=$((count + 1))
            done
          done

          echo "documented $count libraries"

      # A published site must stay under 1 GB. Measure it in bytes, and not in
      # blocks, because a block count adds padding for each of the tens of
      # thousands of small files and overstates the site by a quarter.
      - name: Check the size of the site
        run: |
          bytes=$(du -sb build/docs | cut -f1)
          limit=$((1024 * 1024 * 1024))
          percent=$((bytes * 100 / limit))

          echo "site: $((bytes / 1024 / 1024)) MiB, $percent% of the 1 GB limit of GitHub Pages"

          if [ "$bytes" -ge "$limit" ]; then
            echo "::error::The site is larger than the 1 GB limit of GitHub Pages. Run the workflow by hand with a smaller releases input."
            exit 1
          fi

          if [ "$percent" -ge 80 ]; then
            echo "::warning::The site fills $percent% of the 1 GB limit of GitHub Pages. Lower the releases input before it passes the limit."
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
