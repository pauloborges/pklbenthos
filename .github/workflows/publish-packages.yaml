# Publish a Pkl package for every release that has none yet.
#
# One GitHub release carries one package. The tag is "NAME@VERSION", and the
# assets are the metadata and the zip that `pkl project package` writes. Pkl
# reads the metadata from the URL of the asset, so the name of the release and
# the name of the asset must stay as they are.
name: Publish Pkl packages

on:
  push:
    branches: [main]
    paths:
      - "pkl/**"
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution to publish, or every one of them
        type: choice
        default: all
        options:
          - all
          - redpanda-connect
          - redpanda-connect-cloud
          - bento
          - benthos

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      distributions: ${{ steps.pick.outputs.distributions }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.distribution || 'all' }}
        run: |
          if [ "$CHOICE" = "all" ]; then
            echo 'distributions=["redpanda-connect","redpanda-connect-cloud","bento","benthos"]' >> "$GITHUB_OUTPUT"
          else
            echo "distributions=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One release at a time for a given distribution, and no rush between
      # distributions. A failure on one says nothing about the others.
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.plan.outputs.distributions) }}
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: "0.31.1"

      # A published package must never change, because a consumer holds the
      # checksum of its zip. Take only the releases that have no release yet.
      #
      # Sync already wrote each library as a package, with its PklProject
      # beside the modules, so this reads the tree and needs no command of
      # its own.
      - name: Package and release
        run: |
          for library in "pkl/$DISTRIBUTION"/*/; do
            if [ ! -f "$library/PklProject" ]; then
              continue
            fi

            rm -rf /tmp/out
            pkl project package "$library" --output-path /tmp/out

            # `pkl project package` names both artifacts after the tag, so the
            # zip says what the release is called.
            zip=$(ls /tmp/out/*.zip)
            tag=$(basename "$zip" .zip)

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "have    $tag"
              continue
            fi

            echo "::group::$tag"

            gh release create "$tag" \
              --title "$tag" \
              --notes "Pkl library for the configuration of $DISTRIBUTION, generated by pklbenthos." \
              "/tmp/out/$tag" \
              "/tmp/out/$tag.sha256" \
              "/tmp/out/$tag.zip" \
              "/tmp/out/$tag.zip.sha256"

            echo "::endgroup::"
          done
